<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fixture</title>
    <style>
      body { margin: 0; font: 16px sans-serif; }
      [data-theme="dark"] body { background: #111; color: #eee; }
      header { display: flex; gap: 1rem; padding: 1rem; background: #ddd; }
      [data-theme="dark"] header { background: #333; }
      aside { position: fixed; inset: 0 0 0 auto; width: 300px; padding: 1rem; background: #fc6; color: #000; }
      nav { position: absolute; top: 3rem; right: 1rem; display: flex; flex-direction: column; padding: .5rem; background: #fff; border: 1px solid #999; }
      aside[hidden], section[hidden], p[hidden], nav[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <a href="/settings">Settings</a>
      <button data-overlens-press="menu" onclick="slide(menu)">Menu</button>
      <button data-overlens-press onclick="banner.hidden = !banner.hidden">Banner</button>
      <button data-overlens-press="actions" onclick="actions.hidden = !actions.hidden">Actions</button>
    </header>
    <nav id="actions" hidden>
      <button data-overlens-press="share" onclick="actions.hidden = true; slide(share)">Share</button>
    </nav>
    <p id="banner" hidden>Banner is shown</p>
    <main>Home <time data-overlens-mask>changes on every render</time></main>
    <aside id="menu" hidden>
      <b>Drawer</b>
      <button data-overlens-press="details" onclick="slide(details)">Details</button>
      <section id="details" hidden>Nested details inside the drawer</section>
    </aside>
    <aside id="share" hidden><b>Share drawer</b></aside>
    <script>
      const slide = (el) => {
        el.hidden = false;
        el.animate([{ transform: "translateX(100%)" }, { transform: "none" }], { duration: 1500 });
      };
    </script>
  </body>
</html>
