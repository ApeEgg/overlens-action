name: Overlens

on:
  workflow_call:
    inputs:
      environments:
        description: Regex a deployment's environment name must match to be crawled
        type: string
        default: Preview|Production
      inspector:
        description: Origin of the Overlens inspector the reports link to
        type: string
        default: https://overlens.korte.kim
      runner:
        description: Runner label the jobs run on
        type: string
        default: ubuntu-latest

jobs:
  crawl:
    name: Crawl & Snapshot
    if: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.target_url != '' }}
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    permissions:
      contents: read
    outputs:
      createPR: ${{ steps.flags.outputs.createPR }}
      targetBranch: ${{ steps.flags.outputs.targetBranch }}
    steps:
      - name: Match environment
        id: gate
        env:
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          if echo "$ENVIRONMENT" | grep -Eq "$ENVIRONMENTS"; then
            echo "go=1" >> $GITHUB_OUTPUT
          else
            echo "\"$ENVIRONMENT\" doesn't match /$ENVIRONMENTS/ — not a deployment Overlens crawls"
          fi
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        if: steps.gate.outputs.go
        with:
          persist-credentials: false
      - name: Check for config
        id: config
        if: steps.gate.outputs.go
        run: |
          if [ -f overlens.config.ts ] || [ -f overlens.config.js ]; then
            echo "present=1" >> $GITHUB_OUTPUT
          else
            echo "No overlens.config at this commit — nothing to crawl."
          fi
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        if: steps.config.outputs.present
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .overlens
          sparse-checkout: crawler
          persist-credentials: false
      - if: steps.config.outputs.present
        run: |
          apt-get -o Acquire::Retries=3 update \
            && apt-get install -y --no-install-recommends -o Acquire::Retries=3 unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.config.outputs.present
      - name: Read config flags
        id: flags
        if: steps.config.outputs.present
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          TARGET=$(bun -e 'console.log((await import("./overlens.config")).default.targetBranch)')
          case "$TARGET" in ''|undefined) echo "overlens.config must set targetBranch" >&2; exit 1;; esac
          echo "targetBranch=$TARGET" >> $GITHUB_OUTPUT
          echo "createPR=$(bun -e 'console.log((((await import("./overlens.config")).default.createPR ?? true) ? "true" : "false"))')" >> $GITHUB_OUTPUT
      - if: steps.config.outputs.present
        run: bun install --cwd .overlens/crawler
      - if: steps.config.outputs.present
        working-directory: .overlens/crawler
        run: OVERLENS=1 bunx playwright test overlens.spec
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.config.outputs.present
        with:
          name: overlens-output
          path: .overlens/crawler/overlens-output/

  publish:
    name: Publish snapshots
    needs: crawl
    if: ${{ needs.crawl.outputs.targetBranch != '' }}
    timeout-minutes: 20
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ${{ needs.crawl.outputs.targetBranch }}
      INSPECTOR: ${{ inputs.inspector }}
    steps:
      - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          command -v compare >/dev/null && command -v jq >/dev/null \
            || (sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 imagemagick jq)
      - name: Resolve slug
        run: |
          BRANCH=$(git name-rev --name-only --exclude 'tags/*' $GITHUB_SHA)
          BRANCH="${BRANCH#remotes/origin/}"
          BRANCH="${BRANCH%%[~^]*}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          if [ "$(git rev-parse -q --verify "origin/$BRANCH" || true)" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_SHA is no longer the tip of $BRANCH — superseded deploy, skipping"
          elif [ "$BRANCH" = "$TARGET_BRANCH" ]; then
            echo "SLUG=dev" >> $GITHUB_ENV
          else
            PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
            if [ -n "$PR" ]; then
              echo "SLUG=pr-$PR" >> $GITHUB_ENV
              echo "PR=$PR" >> $GITHUB_ENV
            fi
          fi
      - uses: actions/download-artifact@v4
        if: env.SLUG
        with:
          name: overlens-output
          path: overlens-output
      - name: Push snapshots to overlens branch
        if: env.SLUG
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          LS=$(git ls-remote "$REMOTE" refs/heads/overlens/dev)
          if [ -n "$LS" ]; then
            echo "DEV_EXISTS=1" >> $GITHUB_ENV
            git clone -q --depth 1 --branch overlens/dev "$REMOTE" /tmp/publish
          else
            git init -q -b "overlens/$SLUG" /tmp/publish
          fi
          cd /tmp/publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE_SHA=$(git rev-parse -q --verify HEAD || true)
          cp -R "$GITHUB_WORKSPACE/overlens-output/." .
          printf '{ "git": { "deploymentEnabled": false } }\n' > vercel.json
          : > /tmp/diff-stats.txt
          if [ -n "$BASE_SHA" ]; then
            for f in $(git ls-files '*.png'); do
              [ -f "$GITHUB_WORKSPACE/overlens-output/$f" ] || git rm -q "$f"
            done
            for f in $(git diff --name-only -- '*.png'); do
              git show "HEAD:$f" > /tmp/baseline.png
              GEO=$(identify -format '%w %h ' /tmp/baseline.png "$f" 2>/dev/null \
                | awk 'NF==4{ o=($1<$3?$1:$3)*($2<$4?$2:$4); print ($1<$3?$1:$3) "x" ($2<$4?$2:$4), o, ($1>$3?$1:$3)*($2>$4?$2:$4)-o }' || true)
              read -r OVERLAP OAREA PAD <<< "${GEO:-x 0 0}"
              AE=$(compare -fuzz 5% -metric AE "/tmp/baseline.png[$OVERLAP+0+0]" "$f[$OVERLAP+0+0]" null: 2>&1 | grep -oE '^[0-9.eE+-]+' || true)
              case "$AE" in ''|*[eE]*) ;; *) [ "${AE%%.*}" -gt 32 ] || AE=0 ;; esac
              if [ "$AE" = "0" ] && { [ "$SLUG" != "dev" ] || [ "$PAD" = "0" ]; }; then
                git checkout -q -- "$f"
              else
                PCT=$(awk -v d="${AE:-0}" -v o="$OAREA" 'BEGIN{ if (d+0 > 0 && o+0 > 0) { s=sprintf("%.2f", d*100/o); sub(/\.?0+$/, "", s); printf "%s%%", s } }')
                if [ -n "$PCT" ]; then echo "$f $PCT" >> /tmp/diff-stats.txt; fi
              fi
            done
          fi
          git show HEAD:pages.txt > /tmp/baseline-pages.txt 2>/dev/null || : > /tmp/baseline-pages.txt
          git add -A
          git diff --cached --no-renames --name-status -- '*.png' > /tmp/staged.txt
          if [ "$SLUG" != "dev" ]; then
            : > /tmp/report-pages.jsonl
            while IFS="$(printf '\t')" read -r st f; do
              [ -n "$f" ] || continue
              case "$st" in A*) STATUS=added ;; D*) STATUS=removed ;; *) STATUS=changed ;; esac
              PCT=$(awk -v f="$f" '$1==f{ sub(/%$/, "", $2); print $2 }' /tmp/diff-stats.txt)
              jq -n --arg file "$f" --arg status "$STATUS" --arg pct "$PCT" \
                '{ file: $file, status: $status } + (if $pct == "" then {} else { diffPercent: ($pct | tonumber) } end)' >> /tmp/report-pages.jsonl
            done < /tmp/staged.txt
            BASE_JSON=null
            if [ -n "$BASE_SHA" ]; then BASE_JSON="\"$BASE_SHA\""; fi
            jq -s --argjson baseSha "$BASE_JSON" --argjson sourcePr "$PR" --arg sourceSha "$GITHUB_SHA" \
              '{ baseSha: $baseSha, sourcePr: $sourcePr, sourceSha: $sourceSha, pages: . }' \
              /tmp/report-pages.jsonl > report.json
            git add report.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "$BRANCH @ ${GITHUB_SHA::7}"
          git push -qf "$REMOTE" "HEAD:refs/heads/overlens/$SLUG"
      - name: Report to the source PR
        if: env.PR
        env:
          CREATE_PR: ${{ needs.crawl.outputs.createPR }}
        run: |
          CH=$(cut -f2 /tmp/staged.txt | sed -E 's|^[^/]+/||; s/\.png$//' | sort -u | tr '\n' ' ')
          CHANGED=$(echo "$CH" | wc -w | tr -d ' ')
          awk -F'\t' '$1=="D"{print $2}' /tmp/staged.txt | sed -E 's|^[^/]+/||; s/\.png$//' | sort -u > /tmp/removed-bases.txt
          {
            awk 'NR==FNR{rm[$0]=1; next} { p=$0; st=""; i=index(p, "~"); if (i) { st=substr(p, i); p=substr(p, 1, i-1) } b=(p=="/"?"home":substr(p,2)); gsub(/_/,"__",b); gsub(/\//,"_",b); if ((b st) in rm) print }' \
              /tmp/removed-bases.txt /tmp/baseline-pages.txt
            cat "$GITHUB_WORKSPACE/overlens-output/pages.txt"
          } | sort -u > /tmp/sitemap-pages.txt
          TOTAL=$(grep -c . /tmp/sitemap-pages.txt)
          PCT=$(awk -v c="$CHANGED" -v t="$TOTAL" 'BEGIN{s=sprintf("%.1f", c*100/t); sub(/\.0$/, "", s); printf "%s%%", s}')
          LENS="${INSPECTOR}/${GITHUB_REPOSITORY}/pull/${PR}"
          SRC_TITLE=$(gh pr view "$PR" --json title -q .title)
          if [ "$CHANGED" = "0" ]; then
            SUFFIX="✅ Clean"
          else
            SUFFIX="$PCT"
          fi
          {
            echo "This PR was programmatically created by Overlens. Triggered by PR: #$PR"
            echo
            echo "This diff can be viewed on the [Overlens website]($LENS)."
            echo
            awk -v c="$CHANGED" -v t="$TOTAL" '
              function pct(x,  s){ s=sprintf("%.1f", x); sub(/\.0$/, "", s); return s "%" }
              BEGIN{
                printf "✅ %d/%d (%s) pages identical\n", t-c, t, pct((t-c)*100/t)
                printf "⚠️ %d/%d (%s) pages differentiate\n", c, t, pct(c*100/t)
              }'
            echo
            while IFS="$(printf '\t')" read -r st f; do
              case "$st" in
                A*) label="new" ;;
                D*) label="removed" ;;
                *) label=$(awk -v f="$f" '$1==f{print $2}' /tmp/diff-stats.txt) ;;
              esac
              anchor=$(printf '%s' "$f" | sha256sum | cut -d' ' -f1)
              echo "[$f](https://github.com/${GITHUB_REPOSITORY}/compare/overlens/dev...overlens/$SLUG#diff-$anchor) (${label:-changed})"
            done < /tmp/staged.txt
          } > /tmp/body.md
          {
            echo
            echo '```mermaid'
            awk -v ch="$CH" '
              function nid(p){ if (!(p in ids)) ids[p]="n" (++idc); return ids[p] }
              function lbl(s){ gsub(/\[/, "(", s); gsub(/\]/, ")", s); return s }
              function pbase(p,  s, st, i){ i=index(p, "~"); if (i) { st=substr(p, i); p=substr(p, 1, i-1) } if (p=="/") return "home" st; s=substr(p, 2); gsub(/_/, "__", s); gsub(/\//, "_", s); return s st }
              BEGIN{ n=split(ch, a, " "); for (i=1; i<=n; i++) if (a[i]!="") changed[a[i]]=1; print "graph TD" }
              {
                if ($0=="") next
                pageorder[++pc]=$0
                p=$0; st=""; i=index(p, "~"); if (i) { st=substr(p, i+1); p=substr(p, 1, i-1) }
                path=""
                cnt=split(substr(p, 2), seg, "/")
                for (i=1; i<=cnt; i++) {
                  parent=(path==""?"/":path)
                  path=path "/" seg[i]
                  if (!(path in known)) {
                    known[path]=1
                    edges[++ec]=nid(parent) " --> " nid(path) "[\"" lbl(seg[i]) "\"]"
                  }
                }
                path=(path==""?"/":path)
                cnt=split(st, seg, "~")
                for (i=1; i<=cnt; i++) {
                  parent=path
                  path=path "~" seg[i]
                  if (!(path in known)) {
                    known[path]=1
                    edges[++ec]=nid(parent) " -.-> " nid(path) "[\"~" lbl(seg[i]) "\"]"
                  }
                }
              }
              END{
                printf "  %s[\"/\"]\n", nid("/")
                for (i=1; i<=ec; i++) print "  " edges[i]
                print "  classDef changed fill:#fecaca,stroke:#dc2626,color:#7f1d1d"
                print "  classDef same fill:#dcfce7,stroke:#16a34a,color:#14532d"
                for (i=1; i<=pc; i++) printf "  class %s %s\n", nid(pageorder[i]), (pbase(pageorder[i]) in changed ? "changed" : "same")
              }
            ' /tmp/sitemap-pages.txt
            echo '```'
          } >> /tmp/body.md
          TITLE="🎭 Overlens ($SUFFIX) [$SRC_TITLE]"
          VPR=$(gh pr list --head "overlens/$SLUG" --state open --json url -q '.[0].url')
          if [ -n "$VPR" ]; then
            gh pr edit "${VPR##*/}" --title "$TITLE" --body-file /tmp/body.md
          elif [ "$CHANGED" -gt 0 ] && [ "$CREATE_PR" != "false" ] && [ -n "$DEV_EXISTS" ]; then
            VPR=$(gh pr create --draft --base overlens/dev --head "overlens/$SLUG" \
              --title "$TITLE" --body-file /tmp/body.md) || VPR=""
          fi
          {
            echo "## Summary by Overlens"
            echo
            if [ "$CHANGED" -gt 0 ]; then
              printf '🎭 Visual differences detected — %s of all pages have diffs. ' "$PCT"
              if [ -n "$VPR" ]; then printf '[PR was filed](%s) · ' "$VPR"; fi
              echo "[View on Overlens]($LENS)"
            else
              echo "✅ No visual differences. [View on Overlens]($LENS)"
            fi
          } > /tmp/summary.md
          gh pr view "$PR" --json body -q .body > /tmp/src-body.md
          awk '/<!-- overlens:summary -->/{skip=1} { if (!skip) print } /<!-- \/overlens:summary -->/{skip=0}' /tmp/src-body.md \
            | perl -0pe 's/\s+\z//' > /tmp/src-body-stripped.md
          {
            if [ -s /tmp/src-body-stripped.md ]; then
              cat /tmp/src-body-stripped.md
              echo
              echo
            fi
            echo '<!-- overlens:summary -->'
            cat /tmp/summary.md
            echo '<!-- /overlens:summary -->'
          } > /tmp/src-body-new.md
          gh pr edit "$PR" --body-file /tmp/src-body-new.md

  cleanup:
    name: Cleanup PR
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    timeout-minutes: 5
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          PR=$(gh pr list -R "$GITHUB_REPOSITORY" --head "overlens/pr-${{ github.event.pull_request.number }}" --state open --json number -q '.[0].number')
          [ -z "$PR" ] || gh pr close -R "$GITHUB_REPOSITORY" "$PR"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/overlens/pr-${{ github.event.pull_request.number }}" || true
